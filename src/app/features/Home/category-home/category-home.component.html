<section class="py-16 bg-gray-50">
    <div class="container mx-auto px-4">

        <div class="mb-10">
            <h2 class="text-2xl sm:text-3xl font-bold text-gray-900 tracking-tight">
                Shop By <span class="text-primary">Category</span>
            </h2>
            <div class="mt-2 w-12 h-1 bg-primary rounded"></div>
        </div>

        <div class="grid gap-6 sm:grid-cols-2 md:grid-cols-4 lg:grid-cols-5 xl:grid-cols-7">

            @for (category of categoriesList(); track category.id) {
            <div class="group bg-white rounded p-4 flex flex-col items-center text-center shadow-sm hover:shadow-mdcursor-pointer border border-transparent">

                <div class="w-28 h-28 bg-gray-100 rounded-full overflow-hidden flex items-center justify-center  ring-transparent ">
                    <img [src]="baseUrl + category.imageUrl" 
                         [alt]="category.name" 
                         class="w-full h-full rounded-full object-cover ">
                </div>

                <h3 class="mt-4 text-sm font-semibold text-gray-700 ">
                    {{ category.name }}
                </h3>

            </div>
            }

        </div>

        <div class="mt-16 border-t border-gray-200/60 pt-12">
            <app-two-static />
        </div>
    </div>
</section>
