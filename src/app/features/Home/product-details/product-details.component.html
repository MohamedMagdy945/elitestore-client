<section class="py-12 md:py-20 bg-gradient-to-br from-gray-50 to-gray-100 min-h-screen font-sans">
  <div class="max-w-6xl mx-auto px-4 sm:px-6">

    <div class="grid grid-cols-1 lg:grid-cols-12 gap-8 lg:gap-16 bg-white rounded-3xl shadow-xl shadow-gray-200/50 p-6 md:p-12 border border-gray-100">

      <!-- LEFT COLUMN: IMAGE GALLERY (Occupies 5 cols on large screens) -->
      <div class="lg:col-span-5 space-y-4">
        <!-- Main Image Stage -->
        <div class="group relative rounded-2xl overflow-hidden border border-gray-100 bg-gray-50 aspect-square flex items-center justify-center shadow-inner">
          <img
            [src]="baseUrl + productDetails().imageUrls[0]"
            [alt]="productDetails().name"
            class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-500 ease-out"
          />
          <!-- Luxury Overlay Badge for Discount or Newness if needed later -->
          <span class="absolute top-4 left-4 bg-gray-900/90 backdrop-blur-sm text-white text-2xs uppercase tracking-widest px-3 py-1 rounded-md font-bold shadow-sm">
            Premium
          </span>
        </div>

        <!-- Optional Thumbnail Preview Track (Adds visual depth) -->
        <div class="flex gap-3 overflow-x-auto pb-1 invisible lg:visible">
          <div class="w-20 h-20 rounded-xl overflow-hidden border-2 border-emerald-500 p-0.5 cursor-pointer bg-white flex-shrink-0">
            <img [src]="baseUrl + productDetails().imageUrls[0]" class="w-full h-full object-cover rounded-lg" />
          </div>
          <!-- Placeholder for extra images if they exist -->
          <div *ngIf="productDetails().imageUrls[1]" class="w-20 h-20 rounded-xl overflow-hidden border border-gray-200 p-0.5 opacity-60 hover:opacity-100 cursor-pointer bg-white transition flex-shrink-0">
            <img [src]="baseUrl + productDetails().imageUrls[1]" class="w-full h-full object-cover rounded-lg" />
          </div>
        </div>
      </div>

      <!-- RIGHT COLUMN: REFINED PRODUCT DETAILS (Occupies 7 cols on large screens) -->
      <div class="lg:col-span-7 flex flex-col justify-between space-y-6">
        
        <div class="space-y-4">
          <!-- CATEGORY + BRAND + STOCK BADGES -->
          <div class="flex flex-wrap items-center gap-2">
            <span class="bg-emerald-50 text-emerald-700 text-xs px-3 py-1 rounded-lg font-medium tracking-wide">
              {{productDetails().category.name}}
            </span>

            <span class="bg-gray-100 text-gray-700 text-xs px-3 py-1 rounded-lg font-medium tracking-wide">
              {{productDetails().brand.name}}
            </span>

            <div class="ml-auto inline-flex items-center gap-1.5 text-xs font-semibold text-emerald-700 bg-emerald-50/50 border border-emerald-200/60 px-2.5 py-1 rounded-full">
              <span class="w-1.5 h-1.5 bg-emerald-500 rounded-full animate-pulse"></span>
              In Stock
            </div>
          </div>

          <!-- PRODUCT TITLE -->
          <h1 class="text-3xl md:text-4xl font-black text-gray-900 tracking-tight leading-none pt-1">
            {{productDetails().name}}
          </h1>

          <!-- RATINGS & REVIEWS RE-DESIGNED -->
          <div class="flex items-center gap-3 py-0.5 border-b border-gray-100 pb-4">
            <div class="flex text-amber-400 gap-0.5 text-sm">
              <i class="fas fa-star"></i>
              <i class="fas fa-star"></i>
              <i class="fas fa-star"></i>
              <i class="fas fa-star"></i>
              <i class="fas fa-star-half-alt"></i> <!-- Modernized partial star looks cleaner -->
            </div>

            <span class="text-sm font-bold text-gray-800">
              {{productDetails().ratingsAverage}}
            </span>
            <span class="text-xs text-gray-400">|</span>
            <span class="text-xs text-gray-500 underline underline-offset-4 cursor-pointer hover:text-emerald-600 transition">
              Verified Ratings
            </span>
          </div>

          <!-- PRICE TAG DISPLAY -->
          <div class="pt-2">
            <span class="text-xs text-gray-400 block uppercase font-bold tracking-wider mb-1">Price</span>
            <p class="text-4xl font-black text-gray-900 tracking-tight">
              {{productDetails().price | number}} <span class="text-xl font-bold text-emerald-600 ml-1">EGP</span>
            </p>
          </div>

          <!-- DESCRIPTION BOX -->
          <div class="pt-2">
            <span class="text-xs text-gray-400 block uppercase font-bold tracking-wider mb-1">Overview</span>
            <p class="text-gray-600 leading-relaxed text-sm max-w-2xl bg-gray-50/50 p-4 rounded-xl border border-gray-100">
              {{productDetails().description}}
            </p>
          </div>
        </div>

        <!-- TRANSACTION AND ACTION SECTION -->
        <div class="space-y-4 pt-4 border-t border-gray-100">
          
          <!-- QUANTITY SELECTOR UI (Optional but highly recommended for perfect UX) -->
          <div class="flex items-center gap-4">
            <span class="text-xs text-gray-500 uppercase font-bold tracking-wider">Quantity:</span>
            <div class="flex items-center border border-gray-200 rounded-xl bg-gray-50 p-1">
              <button class="w-8 h-8 rounded-lg flex items-center justify-center font-bold text-gray-600 hover:bg-white hover:shadow-sm active:scale-95 transition">-</button>
              <span class="w-10 text-center font-bold text-sm text-gray-800">1</span>
              <button class="w-8 h-8 rounded-lg flex items-center justify-center font-bold text-gray-600 hover:bg-white hover:shadow-sm active:scale-95 transition">+</button>
            </div>
          </div>

          <!-- CALL TO ACTIONS (CTA) -->
          <div class="grid grid-cols-1 sm:grid-cols-4 gap-3">

            <!-- MAIN ADD TO CART -->
            <button
              (click)="addToCart(productDetails())"
              class="sm:col-span-3 bg-emerald-600 hover:bg-emerald-700 active:scale-[0.99] text-white font-bold py-4 rounded-xl transition duration-200 flex items-center justify-center gap-3 shadow-lg shadow-emerald-600/20 text-sm md:text-base tracking-wide"
            >
              <i class="fas fa-shopping-bag text-sm opacity-90"></i>
              Add to Shopping Bag
            </button>

            <!-- WISHLIST BUTTON -->
            <button
              class="sm:col-span-1 border border-gray-200 hover:border-gray-300 hover:bg-gray-50 active:scale-[0.99] text-gray-700 font-bold py-4 rounded-xl transition duration-200 flex items-center justify-center gap-2 group"
            >
              <i class="far fa-heart text-gray-400 group-hover:text-rose-500 group-hover:scale-110 transition duration-200"></i>
              <span class="sm:hidden text-sm">Save to Wishlist</span>
            </button>

          </div>
        </div>

      </div>
    </div>
  </div>
</section>
