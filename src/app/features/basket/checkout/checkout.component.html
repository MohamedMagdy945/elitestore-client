<section class="container p-6">
  <div class="mb-8">
    <h1 class="text-3xl font-bold text-gray-900">Checkout</h1>
    <p class="text-gray-500 mt-1">
      Complete your order details and payment
    </p>
  </div>

  <div class="grid grid-cols-1 lg:grid-cols-12 gap-8">

    <!-- LEFT: FORM -->
    <div class="lg:col-span-8 bg-white p-6 rounded-2xl border border-gray-200">

      <!-- Customer Info -->
      <h2 class="text-xl font-bold mb-4">Customer Information</h2>

      <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
        <input class="input" placeholder="First Name" [(ngModel)]="model.firstName" />
        <input class="input" placeholder="Last Name" [(ngModel)]="model.lastName" />
        <input class="input md:col-span-2" placeholder="Email" [(ngModel)]="model.email" />
      </div>

      <!-- Address -->
      <h2 class="text-xl font-bold mt-6 mb-4">Shipping Address</h2>

      <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
        <input class="input md:col-span-2" placeholder="Address" [(ngModel)]="model.address" />
        <input class="input" placeholder="City" [(ngModel)]="model.city" />
        <input class="input" placeholder="Country" [(ngModel)]="model.country" />
        <input class="input" placeholder="Zip Code" [(ngModel)]="model.zipCode" />
      </div>

      <!-- Payment -->
      <h2 class="text-xl font-bold mt-6 mb-4">Payment Details</h2>

      <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
        <input class="input md:col-span-2" placeholder="Card Name" [(ngModel)]="model.cardName" />
        <input class="input md:col-span-2" placeholder="Card Number" [(ngModel)]="model.cardNumber" />
        <input class="input" placeholder="Expiration (MM/YY)" [(ngModel)]="model.expiration" />
        <input class="input" placeholder="CVV" [(ngModel)]="model.cvv" />
      </div>

    </div>

    <!-- RIGHT: SUMMARY -->
    <div class="lg:col-span-4">

      <div class="bg-white rounded-2xl border p-6 sticky top-6">

        <h2 class="text-xl font-bold mb-4">Order Summary</h2>

        <div class="space-y-3 text-gray-600">
          <div class="flex justify-between">
            <span>Subtotal</span>
            <span class="font-bold text-gray-900">{{ basket()?.totalPrice }} EGP</span>
          </div>

          <div class="flex justify-between">
            <span>Shipping</span>
            <span class="text-green-600 font-bold">FREE</span>
          </div>
        </div>

        <div class="border-t mt-4 pt-4 flex justify-between font-bold text-lg">
          <span>Total</span>
          <span>{{ basket()?.totalPrice }} EGP</span>
        </div>

        <button
          (click)="placeOrder()"
          class="w-full mt-6 bg-[#138D46] text-white py-3 rounded-xl font-bold hover:bg-green-700 transition"
        >
          Place Order
        </button>

      </div>
    </div>

  </div>
</section>
