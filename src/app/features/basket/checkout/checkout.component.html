<section>
    <div class="container p-6">

        <!-- TITLE -->
        <div class="mb-8">
            <div class="flex items-center gap-3 text-3xl font-bold text-gray-900 mb-2">
                <div class="bg-[#138D46] text-white w-12 h-12 flex items-center justify-center rounded-xl">
                    <i class="fa-solid fa-credit-card"></i>
                </div>
                <h1>Checkout</h1>
            </div>
            <p class="text-gray-500 text-lg">
                Complete your order details and payment securely
            </p>
        </div>

        <div class="grid grid-cols-1 lg:grid-cols-12 gap-8">

            <!-- LEFT SIDE -->
            <div class="lg:col-span-8 flex flex-col gap-6">

                <!-- Customer Info -->
                <div class="bg-white border border-gray-200 rounded-2xl p-6 shadow-sm">
                    <h2 class="text-xl font-bold mb-4 text-gray-900">Customer Information</h2>

                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <input class="input" placeholder="First Name" [(ngModel)]="model.firstName" />
                        <input class="input" placeholder="Last Name" [(ngModel)]="model.lastName" />
                        <input class="input md:col-span-2" placeholder="Email" [(ngModel)]="model.email" />
                    </div>
                </div>

                <!-- Address -->
                <div class="bg-white border border-gray-200 rounded-2xl p-6 shadow-sm">
                    <h2 class="text-xl font-bold mb-4 text-gray-900">Shipping Address</h2>

                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <input class="input md:col-span-2" placeholder="Address" [(ngModel)]="model.address" />
                        <input class="input" placeholder="City" [(ngModel)]="model.city" />
                        <input class="input" placeholder="Country" [(ngModel)]="model.country" />
                        <input class="input" placeholder="Zip Code" [(ngModel)]="model.zipCode" />
                    </div>
                </div>

                <!-- Payment -->
                <div class="bg-white border border-gray-200 rounded-2xl p-6 shadow-sm">
                    <h2 class="text-xl font-bold mb-4 text-gray-900">Payment Method</h2>

                    <div class="space-y-4">

                        <!-- Cash on Delivery -->
                        <label class="flex items-center gap-4 p-4 border border-gray-200 border-2 rounded-xl cursor-pointer 
      hover:border-[#138D46] hover:bg-green-50" [class.border-[#138D46]]="model.paymentMethod === 0"
                            [class.bg-green-50]="model.paymentMethod === 0">
                            <input type="radio" name="payment" class="hidden" [(ngModel)]="model.paymentMethod"
                                [value]="0" />

                            <div class="w-12 h-12 flex items-center justify-center rounded-lg transition-all
        bg-green-100 text-[#138D46]" [class.bg-[#138D46]]="model.paymentMethod === 0"
                                [class.text-white]="model.paymentMethod === 0">
                                <i class="fa-solid fa-money-bill"></i>
                            </div>

                            <div>
                                <h3 class="font-bold text-gray-900">Cash on Delivery</h3>
                                <p class="text-sm text-gray-500">
                                    Pay when your order arrives at your doorstep
                                </p>
                            </div>
                        </label>

                        <!-- Pay Online -->
                        <label class="flex items-center gap-4 p-4 border  border-gray-200 border-2 rounded-xl cursor-pointer
      hover:border-[#138D46] hover:bg-green-50" [class.border-[#138D46]]="model.paymentMethod === 1"
                            [class.bg-green-50]="model.paymentMethod === 1">
                            <input type="radio" name="payment" class="hidden" [(ngModel)]="model.paymentMethod"
                                [value]="1" />

                            <div class="w-12 h-12 flex items-center justify-center rounded-lg transition-all
        bg-gray-100 text-gray-600" [class.bg-[#138D46]]="model.paymentMethod === 1"
                                [class.text-white]="model.paymentMethod === 1">
                                <i class="fa-solid fa-credit-card"></i>
                            </div>

                            <div class="flex-1">
                                <h3 class="font-bold text-gray-900">Pay Online</h3>
                                <p class="text-sm text-gray-500">
                                    Secure payment with Credit/Debit Card via Stripe
                                </p>

                                <div class="flex gap-2 mt-2 opacity-80">
                                    <img src="assets/visa.png" class="h-5" />
                                    <img src="assets/mastercard.png" class="h-5" />
                                    <img src="assets/amex.png" class="h-5" />
                                </div>
                            </div>
                        </label>

                    </div>
                </div>

            </div>

            <!-- RIGHT SIDE -->
            <div class="lg:col-span-4">

                <div class="bg-white rounded-2xl border border-gray-200 shadow-sm sticky top-6 overflow-hidden">

                    <!-- HEADER -->
                    <div class="bg-[#138D46] text-white p-6">
                        <div class="flex items-center gap-3 font-bold text-xl mb-1">
                            <i class="fa-solid fa-lock"></i> Order Summary
                        </div>
                        <div class="text-sm text-green-100">
                            Secure checkout
                        </div>
                    </div>

                    <!-- BODY -->
                    <div class="p-6">

                        <div class="space-y-4 text-gray-600 mb-6">
                            <div class="flex justify-between">
                                <span>Subtotal</span>
                                <span class="font-bold text-gray-900">{{ basket()?.totalPrice }} EGP</span>
                            </div>

                            <div class="flex justify-between">
                                <span>Shipping</span>
                                <span class="font-bold text-[#138D46]">FREE</span>
                            </div>
                        </div>

                        <div class="border-t pt-5 mb-6 flex justify-between items-end">
                            <span class="font-bold text-lg">Total</span>
                            <span class="font-black text-2xl text-gray-900">
                                {{ basket()?.totalPrice }} EGP
                            </span>
                        </div>

                        <button (click)="placeOrder()"
                            class="w-full py-4 bg-[#138D46] text-white font-bold rounded-xl hover:bg-green-700 transition shadow-md hover:shadow-lg flex items-center justify-center gap-2">
                            <i class="fa-solid fa-lock"></i> Place Order
                        </button>

                        <button
                            class="w-full mt-3 py-3 border border-gray-200 text-gray-600 font-bold rounded-xl hover:bg-gray-50 transition">
                            Apply Promo Code
                        </button>

                    </div>
                </div>

            </div>

        </div>
    </div>
</section>
