@if(message$ | async; as message) {
<div id="toast-success"
     class="fixed top-5 right-5 z-50 flex items-center w-full max-w-xs p-4 text-gray-500 bg-white rounded-lg shadow">

    <div class="inline-flex items-center justify-center w-8 h-8 text-green-500 bg-green-100 rounded-lg">
        ✓
    </div>

    <div class="ms-3 text-sm font-normal">
        {{ message }}
    </div>

</div>
}
