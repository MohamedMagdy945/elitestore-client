@if(message$ | async; as message) {
<div id="toast-success"
     class="fixed top-5 right-5 z-50 flex items-center
            w-full max-w-sm p-4
            bg-slate-100
            border-l-4 border-emerald-500
            rounded-r-xl
            shadow-lg shadow-slate-300/30
            transition-all duration-300">

    <div class="inline-flex items-center justify-center shrink-0
                w-8 h-8 rounded-lg
                bg-emerald-50 text-emerald-600">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round"
                  stroke-linejoin="round"
                  stroke-width="2.5"
                  d="M5 13l4 4L19 7" />
        </svg>
    </div>

    <div class="ms-3 text-sm font-semibold text-slate-800">
        {{ message }}
    </div>

</div>
}
