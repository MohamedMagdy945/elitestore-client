@if(message$ | async; as message) {
<div id="toast-success"
     class="fixed top-5 right-5 z-50 flex items-center w-full max-w-xs p-4 text-emerald-900 bg-emerald-50/90 border border-emerald-200/50 rounded-xl shadow-xl shadow-emerald-900/5 backdrop-blur-md transition-all duration-300 ease-out animate-slide-in dark:bg-emerald-950 dark:text-emerald-100 dark:border-emerald-800/50">

    <!-- أيقونة الـ Check احترافية بخلفية ناعمة ومتناسقة -->
    <div class="inline-flex items-center justify-center shrink-0 w-8 h-8 text-white bg-emerald-600 rounded-lg shadow-sm shadow-emerald-600/20">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M5 13l4 4L19 7"></path>
        </svg>
    </div>

    <!-- نص الرسالة - مريح للعين -->
    <div class="ms-3 text-sm font-medium tracking-wide">
        {{ message }}
    </div>

</div>
}
